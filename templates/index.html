<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 Мой список задач</h1>

        <!-- Форма добавления задачи -->
        <form action="{{ url_for('add_task') }}" method="POST" class="add-form">
            <input type="text" name="content" placeholder="Введите новую задачу..." required>
            <button type="submit">Добавить</button>
        </form>

        <!-- Список задач -->
        <ul class="task-list">
            {% for task in tasks %}
            <li class="task-item">
                <span class="task-content">{{ task.content }}</span>
                <a href="{{ url_for('delete_task', task_id=task.id) }}" class="delete-btn">✕</a>
            </li>
            {% endfor %}
        </ul>

        {% if tasks|length == 0 %}
        <p class="empty-message">Список задач пуст. Добавьте первую задачу!</p>
        {% endif %}
    </div>
</body>
</html>
